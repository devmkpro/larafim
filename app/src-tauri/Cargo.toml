[package]
name = "sentinel-app"
description = "Sentinel — gerenciador local de PHP, Node e serviços"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sentinel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sentinel-core.workspace = true
sentinel-runtimes.workspace = true
sentinel-server.workspace = true
tokio = { version = "1", features = ["time"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
